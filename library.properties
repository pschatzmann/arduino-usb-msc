name=usb-host-msc
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=USB Host Mass Storage for ESP32-S2/S3, RP2040, STM32F4/F7 and MAX3421E boards: block access plus FAT/exFAT and ext2/3/4 filesystems.
paragraph=USBHostMSC wraps TinyUSB's host-mode Mass Storage driver for block-level access to a USB flash drive. USBMscFatFS (FAT12/16/32, exFAT, via TinyFATFS) and USBMscExt4FS/USBMscExt4FSReadOnly (ext2/3/4, via TinyEXT4) add MBR parsing and a mounted filesystem, exposed as fs::FS/File on ESP32/RP2040 or USBMscFile on STM32. Pass a filesystem object to USBHostMSC's constructor to auto-mount it. Uses the TinyUSB built into the ESP32 (S2/S3) and RP2040 cores; STM32, ESP32-P4 and MAX3421E boards additionally need the Adafruit TinyUSB Library, see docs/BOARDS.md.
category=Communication
url=https://github.com/pschatzmann/arduino-usb-host-msc
architectures=esp32,rp2040,stm32
includes=USBHostMSC.h
depends=TinyFATFS,TinyEXT4
license=MIT
