name=usb-msc
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=USB Mass Storage host and device mode: read USB sticks (host) or act as one (device), with FAT/exFAT and ext2/3/4 filesystems.
paragraph=Host mode: USBHostMSC wraps TinyUSB's host-mode Mass Storage driver for block-level access to a USB flash drive; USBHostMscFatIO and USBHostMscExt4IO are block drivers that mount it with TinyFATFS (FAT12/16/32, exFAT) or TinyEXT4 (ext2/3/4), with safe handling of unplugged and replaced drives. Device mode: USBDeviceMSC exports any block driver of TinyFATFS/TinyEXT4 (RAM disk, SD card, NBD, ...) or your own to a PC as a USB drive, on top of the core's USBMSC (ESP32-S2/S3) or Adafruit_USBD_MSC. Uses the TinyUSB built into the ESP32 (S2/S3) and RP2040 cores; STM32, ESP32-P4 and MAX3421E boards additionally need the Adafruit TinyUSB Library, see https://github.com/pschatzmann/arduino-usb-msc/wiki/BOARDS.
category=Communication
url=https://github.com/pschatzmann/arduino-usb-msc
architectures=esp32,rp2040,stm32
includes=USBHostMSC.h,USBHostMscFatIO.h,USBHostMscExt4IO.h,USBDeviceMSC.h
depends=TinyFATFS,TinyEXT4
license=MIT
