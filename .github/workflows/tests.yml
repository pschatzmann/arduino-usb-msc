name: tests
on: [push, pull_request]
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ dosfstools exfatprogs e2fsprogs mtools gdisk fdisk
      - name: Host + device unit tests
        run: |
          cmake -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure
